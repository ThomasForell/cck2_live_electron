<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8" />
</head>
<style type="text/css">
    body {
        overflow: hidden;
        /* Hide scrollbars */
    }

    h1 {
        font-family: Geneva, sans-serif;
        font-size: 50px;
        text-align: center;
    }

    .block-right {
        width: 75px;
        max-width: 75px;
        text-align-last: center;
    }   

    .block-num-place {
        width: 95px;
        max-width: 95px;
        text-align-last: center;
    }

    .block-cap {
        width: 250px;
        max-width: 250px
    }

    .tg {
        border-collapse: collapse;
        border-spacing: 0;
        table-layout: fixed;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .tg td {
        font-family: Geneva, sans-serif;
        font-size: 21px;
        padding: 2px 2px;
        border-style: solid;
        border-width: 3px;
        overflow: hidden;
        word-break: normal;
        border-color: #cccccc
    }

    .tg th {
        font-family: Geneva, sans-serif;
        font-size: 30px;
        padding: 2px 2px;
        border-style: solid;
        border-width: 3px;
        overflow: hidden;
        word-break: normal;
        border-color: #cccccc
    }

    .tg .logo {
        background-color: #ffffff;
        text-align: center;
        white-space: nowrap
    }

    .tg .data-num {
        background-color: #ffffff;
        text-align: center;
        overflow: hidden;
        text-overflow: clip;
        white-space: nowrap
    }

    .tg .data-right {
        background-color: #ffffff;
        text-align: right;
        overflow: hidden;
        text-overflow: clip;
        white-space: nowrap
    }

    .tg .label {
        background-color: #cccccc;
        text-align: left;
        overflow: hidden;
        text-overflow: clip;
        white-space: nowrap;
        font-weight: bold;
    }

    .tg .label-num {
        background-color: #cccccc;
        text-align: center;
        overflow: hidden;
        text-overflow: clip;
        white-space: nowrap;
        font-weight: bold;
    }

    .tg .label-right {
        background-color: #cccccc;
        text-align: right;
        overflow: hidden;
        text-overflow: clip;
        white-space: nowrap;
        font-weight: bold;
    }

    .tg .free {
        border-top-style: hidden;
        border-bottom-style: hidden;
        width: 5px;
        max-width: 5px;
    }

    .tg .no-border-top {
        border-top-style: hidden;
        border-left-style: hidden;
        border-right-style: hidden;
        background-color: #ffffff;
        text-align: center;
        vertical-align: bottom;
        font-size: 40px;
        font-weight: bolder
    }

    .tg .no-border-pic {
        border-top-style: hidden;
        border-left-style: hidden;
        border-right-style: hidden;
        background-color: #ffffff
    }

    .tg .no-border-bot {
        border-bottom-style: hidden;
        border-left-style: hidden;
        border-right-style: hidden;
        background-color: #ffffff;
        text-align: center
    }

    .center {
        display: block;
        margin-left: auto;
        margin-right: auto
    }
</style>

<h1 id="title">U19 Ländervergleich</h1>

<div style="position: fixed; bottom: 5px; width:100%; align-content: center;" id="table-team">
</div>
<script>
    function GenerateTeamResultTable(offset, numPlayers) {
        let table = '<table class="tg">'
        table += '<tr>'
        table += '  <td class="label" colspan="3" id="team' + (offset) + '">Team 1</td>'
        table += '  <td class="free" rowspan="' + (numPlayers + 2) + '"></td>'
        table += '  <td class="label" colspan="3" id="team' + (offset + 1) + '">Team 2</td>'
        table += '  <td class="free" rowspan="' + (numPlayers + 2) + '"></td>'
        table += '  <td class="label" colspan="3" id="team' + (offset + 2) + '">Team 3</td>'
        table += '  <td class="free" rowspan="' + (numPlayers + 2) + '"></td>'
        table += '  <td class="label" colspan="3" id="team' + (offset + 3) + '">Team 4</td>'
        table += '</tr>'

        table += '<tr>'
        table += '    <td class="logo" rowspan="' + (numPlayers + 1) + '"><img src="logos/team/bayern.jpg" alt="Logo" height="auto" width="120" id="team' + (offset) + '_img" /></td>'
        table += '    <td class="data">'
        table += '        <div class="block-cap" id="spieler' + (offset) + '0"></div>'
        table += '    </td>'
        table += '    <td class="data-right">'
        table += '        <div class="block-right" id="spieler' + (offset) + '0r">0</div>'
        table += '    </td>'
        table += '    <td class="logo" rowspan="' + (numPlayers + 1) + '"><img src="logos/team/hessen.jpg" alt="Logo" height="auto" width="120" id="team' + (offset + 1) + '_img" /></td>'
        table += '    <td class="data">'
        table += '        <div class="block-cap" id="spieler' + (offset + 1) + '0"></div>'
        table += '    </td>'
        table += '    <td class="data-right">'
        table += '        <div class="block-right" id="spieler' + (offset + 1) + '0r">0</div>'
        table += '    </td>'
        table += '    <td class="logo" rowspan="' + (numPlayers + 1) + '"><img src="logos/team/bayern.jpg" alt="Logo" height="auto" width="120" id="team' + (offset + 2) + '_img" /></td>'
        table += '    <td class="data">'
        table += '        <div class="block-cap" id="spieler' + (offset + 2) + '0"></div>'
        table += '    </td>'
        table += '    <td class="data-right">'
        table += '        <div class="block-right" id="spieler' + (offset + 2) + '0r">0</div>'
        table += '    </td>'
        table += '    <td class="logo" rowspan="' + (numPlayers + 1) + '"><img src="logos/team/hessen.jpg" alt="Logo" height="auto" width="120" id="team' + (offset + 3) + '_img" /></td>'
        table += '    <td class="data">'
        table += '        <div class="block-cap" id="spieler' + (offset + 3) + '0"></div>'
        table += '    </td>'
        table += '    <td class="data-right">'
        table += '        <div class="block-right" id="spieler' + (offset + 3) + '0r">0</div>'
        table += '    </td>'
        table += '</tr>'

        for (let i = 1; i < numPlayers; ++i) {
            table += '<tr>'
            table += '    <td class="data">'
            table += '        <div class="block-cap" id="spieler' + (offset) + '' + i +'"></div>'
            table += '    </td>'
            table += '    <td class="data-right">'
            table += '        <div class="block-right"id="spieler' + (offset) + '' + i +'r">0</div>'
            table += '    </td>'
            table += '    <td class="data">'
            table += '        <div class="block-cap" id="spieler' + (offset + 1) + '' + i + '"></div>'
            table += '    </td>'
            table += '    <td class="data-right">'
            table += '        <div class="block-right" id="spieler' + (offset + 1) + '' + i + 'r">0</div>'
            table += '    </td>'
            table += '    <td class="data">'
            table += '        <div class="block-cap" id="spieler' + (offset + 2) + '' + i +'"></div>'
            table += '    </td>'
            table += '    <td class="data-right">'
            table += '        <div class="block-right"id="spieler' + (offset + 2) + '' + i +'r">0</div>'
            table += '    </td>'
            table += '    <td class="data">'
            table += '        <div class="block-cap" id="spieler' + (offset + 3) + '' + i + '"></div>'
            table += '    </td>'
            table += '    <td class="data-right">'
            table += '        <div class="block-right" id="spieler' + (offset + 3) + '' + i + 'r">0</div>'
            table += '    </td>'
            table += '</tr>'
        }
        table += '<tr>'
            table += '    <td class="label">'
            table += '        <div class="block-cap">Platz ' + (offset + 1) + '</div>'
            table += '    </td>'
            table += '    <td class="data-right">'
            table += '        <div class="block-right" id="team_total_' + (offset) + '">0</div>'
            table += '    </td>'
            table += '    <td class="label">'
            table += '        <div class="block-cap">Platz ' + (offset + 2) + '</div>'
            table += '    </td>'
            table += '    <td class="data-right">'
            table += '        <div class="block-right" id="team_total_' + (offset + 1) + '">0</div>'
            table += '    </td>'
            table += '    <td class="label">'
            table += '        <div class="block-cap">Platz ' + (offset + 3) + '</div>'
            table += '    </td>'
            table += '    <td class="data-right">'
            table += '        <div class="block-right" id="team_total_' + (offset + 2) + '">0</div>'
            table += '    </td>'
            table += '    <td class="label">'
            table += '        <div class="block-cap">Platz ' + (offset + 4) + '</div>'
            table += '    </td>'
            table += '    <td class="data-right">'
            table += '        <div class="block-right" id="team_total_' + (offset + 3) + '">0</div>'
            table += '    </td>'
            table += '</tr>'

        table += '</table>'
        return table
    }
    current_pos = document.getElementById("table-team")
    current_pos.hidden = false
    current_pos.innerHTML =
        GenerateTeamResultTable(0, 8) + '<p>'
        + GenerateTeamResultTable(4, 8) + '<p>'
        + GenerateTeamResultTable(8, 8)
</script>

<div style="position: fixed; bottom: 5px; width:100%; align-content: center;" id="table-single">
</div>
<script>
    function GenerateSingleResultTable() {
        const numRows = 25
        let table = '<table class="tg" align="center">'
        table += '<tr>'
        table += '<td class="label-right"><div class="block-num-place">Platz</div></td><td class="label">Name</td><td class="label">Landesverband</td>'
            + '<td class="label-num"><div class="block-num">Gesamt</div></td>'
        table += '<td class="free" rowspan="' + (numRows + 1) + '"> </td>' 
        table += '<td class="label-right"><div class="block-num-place">Platz</div></td><td class="label">Name</td><td class="label">Landesverband</td>'
            + '<td class="label-num"><div class="block-num">Gesamt</div></td>'
        table += '</tr>'
        for (let i = 0; i < numRows; ++i) {
            table += '<tr><td class="label-num"><div class="block-num-place">' + (i + 1) + '</div></td>'
            table += '<td class="data"><div class="block-cap" id="single_spieler_' + i + '"></div></td>'
            table += '<td class="data"><div class="block-cap" id="single_mannschaft_' + i + '"></div></td>'
            table += '<td class="data-right"><div class="block-num" id="single_gesamt_' + i + '">0</div></td>'
            table += '<td class="label-num"><div class="block-num-place">' + (numRows + i + 1) + '</div></td>'
            table += '<td class="data"><div class="block-cap" id="single_spieler_' + (numRows + i) + '"></div></td>'
            table += '<td class="data"><div class="block-cap" id="single_mannschaft_' + (numRows + i) + '"></div></td>'
            table += '<td class="data-right"><div class="block-num" id="single_gesamt_' + (numRows + i) + '">0</div></td></tr>'
        }
        table += '</table>'
        return table
    }
    current_pos = document.getElementById("table-single")
    current_pos.hidden = true
    current_pos.innerHTML = GenerateSingleResultTable()
</script>

<script src="team.js"></script>
<script>
  showTeamCompetition();
  setInterval(showTeamCompetition, 1000); 
</script>
</html>
