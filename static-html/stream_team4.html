<script>
    function GenerateTeamResultTable(numPlayers) {
        let table = '<table class="tg">'
        table += '<tr>'
        table +=     '<td class="label" colspan="3" id="team0">Team 1</td>'
        table +=     '<td class="free" rowspan="' + (numPlayers + 2) + '"></td>'
        table +=     '<td class="label" colspan="3" id="team1">Team 2</td>'
        table +=     '<td class="free" rowspan="' + (numPlayers + 2) + '"></td>'
        table +=     '<td class="label" colspan="3" id="team2">Team 3</td>'
        table +=     '<td class="free" rowspan="' + (numPlayers + 2) + '"></td>'
        table +=     '<td class="label" colspan="3" id="team3">Team 4</td>'
        table += '</tr>'
        table += '<tr>'
        table +=     '<td class="logo" rowspan="' + (numPlayers + 1) + '"><img src="logos/team/bayern.jpg" alt="Logo T0" height="auto" width="140px" id="team0_img" /></td>'
        table +=     '<td class="data"><div class="block-cap" id="spieler00"></div></td>'
        table +=     '<td class="data-right"><div class="block-righ" id="spieler00r">0</div></td>'
        table +=     '<td class="logo" rowspan="' + (numPlayers + 1) + '"><img src="logos/team/hessen.jpg" alt="Logo T1" height="auto" width="140px" id="team1_img" /></td>'
        table +=     '<td class="data"><div class="block-cap" id="spieler10"></div></td>'
        table +=     '<td class="data-right"><div class="block-right" id="spieler10r">0</div></td>'
        table +=     '<td class="logo" rowspan="' + (numPlayers + 1) + '"><img src="logos/team/suedbaden.jpg" alt="Logo T2" height="auto" width="140px" id="team2_img" /></td>'
        table +=     '<td class="data"><div class="block-cap" id="spieler20"></div></td>'
        table +=     '<td class="data-right"><div class="block-right" id="spieler20r">0</div></td>'
        table +=     '<td class="logo" rowspan="' + (numPlayers + 1) + '"><img src="logos/team/wuerttemberg.jpg" alt="Logo T3" height="auto" width="140px" id="team3_img" /></td>'
        table +=     '<td class="data"><div class="block-cap" id="spieler30"></div></td>'
        table +=     '<td class="data-right"><div class="block-right" id="spieler30r">0</div></td>'
        table += '</tr>'
        for (let i = 1; i < numPlayers; ++i) {
            table += '<tr>'
            for (let j = 0; j < 4; ++j) {
                table +=     '<td class="data"><div class="block-cap" id="spieler' + j + '' + i + '"></div></td>'
                table +=     '<td class="data-right"><div class="block-right" id="spieler' + j + '' + i + 'r">0</div></td>'
            }
            table += '</tr>'
        }
        table += '<tr>'
        for (let i = 0; i < numPlayers; ++i) {
            table +=     '<td class="label"><div class="block-cap"></div></td>'
            table +=     '<td class="data-right"><div class="block-right" id="team_total_' + i + '">1000</div></td>'
        }
        table += '</tr></table>'
        return table
    }
    current_pos = document.getElementById("table")
    current_pos.innerHTML = GenerateTeamResultTable(4) 
</script>
