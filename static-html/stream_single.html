<script>
  const configName = window.location.pathname.slice(0, -4) + "json";

  function showLaneData(lane, showLanes, numLanes, showSetPoints, offset) {
    try {
        var el = document.getElementById("display4lanes");
        if (el != null) {
        el.hidden = (numLanes != 4 || !showLanes);
        }
        var el = document.getElementById("display6lanes");
        if (el != null) {
        el.hidden = (numLanes != 6  || !showLanes);
        }
        if (!showLanes) {
        return;
        }

        var el = document.getElementById("name" + numLanes + "lanes");
        for (laneCnt = 0; laneCnt < numLanes; laneCnt++) {
        var spieler = lane[laneCnt + offset].spielername;
        if (showSetPoints) {
            spieler += " (" + lane[laneCnt].sp + ")";
        }
        el.innerHTML = spieler;
        if (laneCnt < numLanes -1) {
            el = el.parentElement.nextElementSibling.nextElementSibling.firstChild;
        }
        }

        var el = document.getElementById("team" + numLanes + "lanes");
        for (laneCnt = 0; laneCnt < numLanes; laneCnt++) {
        el.innerHTML = lane[laneCnt + offset].mannschaft;
        if (laneCnt < numLanes -1) {
            el = el.parentElement.nextElementSibling.nextElementSibling.firstChild;
        }
        }

        var el = document.getElementById("total" + numLanes + "lanes");
        for (laneCnt = 0; laneCnt < numLanes; laneCnt++) {
        el.innerHTML = lane[laneCnt + offset].wurf;
        el = el.parentElement.nextElementSibling.nextElementSibling.firstChild;
        el.innerHTML = lane[laneCnt + offset].gesamt;
        if (laneCnt < numLanes -1) {
            el = el.parentElement.nextElementSibling.nextElementSibling.nextElementSibling.firstChild;
        }
        }

        var el = document.getElementById("heat" + numLanes + "lanes");
        for (laneCnt = 0; laneCnt < numLanes; laneCnt++) {
        el.innerHTML = lane[laneCnt + offset].durchgang_wurf;
        el = el.parentElement.nextElementSibling.nextElementSibling.firstChild;
        el.innerHTML = lane[laneCnt + offset].durchgang_gesamt;
        if (laneCnt < numLanes -1) {
            el = el.parentElement.nextElementSibling.nextElementSibling.nextElementSibling.firstChild;
        }
        }
    } catch (ex) {
        console.error("writeBahn", ex.message);
    }
}

  function showPlayers(dataName, group) {
    try {
        const requestURL = dataName + "?" + Date.now().toString()
        fetch(requestURL)
        .then((response) => { return response.text() })
        .then((decoded) => {
            if (decoded.charCodeAt(0) === 0xFEFF) {
                decoded = decoded.substring(1);
            }
            const data = JSON.parse(decoded);

            let el = document.getElementById("group")
            if (el != null) {
                el.innerHTML = group
            }

            for (let i = 0; i < data.length; ++i) {
                const p = data[i]; 

                const colorActive = "#50C878";
                const colorInactive = "#ffffff";
                const color = (p.active && p.name != " ") ? colorActive : colorInactive

                el = document.getElementById("name_" + i.toString())
                if (el) {
                    el.style.backgroundColor = color
                    el.innerHTML = p.name
                }
                
                el = document.getElementById("team_" + i.toString())
                if (el) {
                    el.style.backgroundColor = color
                    el.innerHTML = p.mannschaft
                }

                el = document.getElementById("total_" + i.toString())
                if (el) {
                    el.style.backgroundColor = color
                    el.innerHTML = p.gesamt
                }
            }
            for (let i = data.length; i < 12; ++i) {
                el = document.getElementById("name_" + i.toString())
                if (el) {
                    el.style.backgroundColor = color
                    el.innerHTML = ""
                }
                
                el = document.getElementById("team_" + i.toString())
                if (el) {
                    el.style.backgroundColor = color
                    el.innerHTML = ""
                }

                el = document.getElementById("total_" + i.toString())
                if (el) {
                    el.style.backgroundColor = color
                    el.innerHTML = ""
                }            
            }
        }) } catch (ex) {
        console.error("showData", ex.message);
    }
  }

  function showData(configName) {
    try {
        const requestURL = configName + "?" + Date.now().toString()
        fetch(requestURL)
        .then((response) => { return response.text() })
        .then((decoded) => {
            if (decoded.charCodeAt(0) === 0xFEFF) {
            decoded = decoded.substring(1);
            }
            const config = JSON.parse(decoded);

            // config.zeit = 2
            const timeCurrent = Math.trunc(Date.now() / 1000) % (config.zeit * config.files.length)
            const idx = Math.trunc(timeCurrent / config.zeit)

            showPlayers(config.files[idx], config.group_names[idx])
    }) } catch (ex) {
        console.error("showData", ex.message);
    }
    try {
        const requestURL = "result.json?" + Date.now().toString()
        var offset = 0
        if (configName.includes("Rechts")) {
            offset = 4
        }
        fetch(requestURL)
        .then((response) => { return response.text() })
        .then((decoded) => {
            if (decoded.charCodeAt(0) === 0xFEFF) {
                decoded = decoded.substring(1);
            }
            const result = JSON.parse(decoded);
            showLaneData(result.bahn, true, 4, false, offset)
    }) } catch (ex) {
        console.error("showData", ex.message);
    }

  }

  showData(configName);
  setInterval(showData, 1000, configName); 
</script>
</html>
