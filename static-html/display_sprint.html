<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
</head>
<style type="text/css">
body {overflow:hidden; /* Hide scrollbars */}
    h1 {
        font-family: Geneva, sans-serif;
        font-size: 50px;
        text-align: center;
    }
.block-num{width:75px;max-width:75px}
.block-num-sv{width:50px;max-width:50px}
.block-cap{width:520px;max-width:520px}
.block-scr{width:40px;max-width:40px;text-align:right}
.block-gsm{width:210px;max-width:240px}
.block-mp {width:60px;max-width:240px}
.tg    {border-collapse:collapse;border-spacing:0;table-layout:fixed;  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
.tg td{font-family:Geneva, sans-serif;font-size:20px;font-weight:bold;padding:2px 2px;border-style:solid;border-width:3px;overflow:hidden;word-break:normal;border-color:#cccccc}
.tg th{font-family:Geneva, sans-serif;font-size:20px;font-weight:bold;padding:2px 2px;border-style:solid;border-width:3px;overflow:hidden;word-break:normal;border-color:#cccccc}
.tg .caption {background-color:#ffffff;font-size:25px;                                                                white-space:nowrap}
.tg .no_border_right {border-right-color: #ffffff;}
.tg .no_border_left  {border-left-color: #ffffff;}
.tg .logo    {background-color:#ffffff;text-align:center;white-space:nowrap}
.tg .data    {background-color:#ffffff;                  width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .data-num{background-color:#ffffff;text-align:center;width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .data-right{background-color:#ffffff;text-align:right;width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .label   {background-color:#cccccc;    text-align:center;              width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .label-num{background-color:#cccccc;text-align:center;width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .label-right{background-color:#cccccc;text-align:right;width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .free      {border-top-style:hidden;border-bottom-style:hidden;width:5px}
</style>

<div style="position: fixed; top: 5px; width:100%; align-content: center;" id="table">
<script>

  + '<tr>'

  + '  <td class="data-num"><div class="block-num-sv" id="satz_sv_' + offset1 + '_0_1"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_ '+ offset1 + '_1_1">0</div></td>'

    }
    function GenerateSprintResultTable(offset1) {
        return '<table class="tg" align="center">'
  + '<tr>'
  + '  <td class="label"><div class="block-cap">Team</div></td>'
  + '  <td class="label"><div class="block-num">Wurf</div></td>'
  + '  <td class="label"><div class="block-num">Satz 1</div></td>'

  + ' </tr>'

  + '  <td class="data"><div class="block-cap" id="spieler_' + offset1 + '_0"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="wurf_' + offset1 + '_0_0">0</div></td>'

  + '  <td class="data-num"><div class="block-num" id="wurf_' + offset1 + '_0_1">0</div></td>'

  + '  <td class="data-num"><div class="block-num-sv" id="sv_' + offset1 + '_1"></div></td>'
  + '</tr>'
  + '</table>'
    }
    // get num games
    let numGames = 8 
    current_pos = document.getElementById("table")
    current_pos.innerHTML += '<h1 id="title">U19 Ländervergleich</h1>'
    if (numGames > 8) {
        for (let i = 0; i < numGames / 2 - 1; ++i)
            current_pos.innerHTML += GenerateSprintResultTableTwo(i, i + numGames / 2) + "<p></p>"
        current_pos.innerHTML += GenerateSprintResultTableTwo(numGames / 2 - 1, numGames - 1)
    }
    else {
        for (let i = 0; i < numGames - 1; ++i)
            current_pos.innerHTML += GenerateSprintResultTable(i) + "<p></p>"
        current_pos.innerHTML += GenerateSprintResultTable(numGames - 1)
    }
</script>
</div>
