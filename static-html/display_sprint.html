<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
</head>
<style type="text/css">
body {overflow:hidden; /* Hide scrollbars */}
    h1 {
        font-family: Geneva, sans-serif;
        font-size: 50px;
        text-align: center;
    }
.block-num{width:75px;max-width:75px}
.block-cap{width:450px;max-width:450px}
.block-scr{width:40px;max-width:40px;text-align:right}
.block-gsm{width:210px;max-width:240px}
.block-mp {width:60px;max-width:240px}
.tg    {border-collapse:collapse;border-spacing:0;table-layout:fixed;  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
.tg td{font-family:Geneva, sans-serif;font-size:22px;font-weight:bold;padding:2px 2px;border-style:solid;border-width:3px;overflow:hidden;word-break:normal;border-color:#cccccc}
.tg th{font-family:Geneva, sans-serif;font-size:22px;font-weight:bold;padding:2px 2px;border-style:solid;border-width:3px;overflow:hidden;word-break:normal;border-color:#cccccc}
.tg .caption {background-color:#ffffff;font-size:25px;                                                                white-space:nowrap}
.tg .no_border_right {border-right-color: #ffffff;}
.tg .no_border_left  {border-left-color: #ffffff;}
.tg .logo    {background-color:#ffffff;text-align:center;white-space:nowrap}
.tg .data    {background-color:#ffffff;                  width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .data-num{background-color:#ffffff;text-align:center;width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .data-right{background-color:#ffffff;text-align:right;width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .label   {background-color:#cccccc;    text-align:center;              width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .label-num{background-color:#cccccc;text-align:center;width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .label-right{background-color:#cccccc;text-align:right;width:40px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tg .free      {border-top-style:hidden;border-bottom-style:hidden;width:12px}
</style>

<div style="position: fixed; bottom: 5px; width:100%; align-content: center;" id="table">
<script>
    function GenerateSprintResultTable(offset) {
        return '<table class="tg">'
  + '<tr>'
  + '  <td class="label"><div class="block-cap">Team</div></td>'
  + '  <td class="label"><div class="block-num">Satz 1</div></td>'
  + '  <td class="label"><div class="block-num">SV 1</div></td>'
  + '  <td class="label"><div class="block-num">Satz 2</div></td>'
  + '  <td class="label"><div class="block-num">SV 2</div></td>'
  + '  <td class="label"><div class="block-num">SV</div></td>'
  + '  <td class="free"></td>'
  + '  <td class="label"><div class="block-cap">Team</div></td>'
  + '  <td class="label"><div class="block-num">Satz 1</div></td>'
  + '  <td class="label"><div class="block-num">SV 1</div></td>'
  + '  <td class="label"><div class="block-num">Satz 2</div></td>'
  + '  <td class="label"><div class="block-num">SV 2</div></td>'
  + '  <td class="label"><div class="block-num">SV</div></td>'
  + ' </tr>'
  + ' <tr>'
  + '  <td class="data"><div class="block-cap" id="spieler_' + offset + '_0"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_' + offset + '_0_0">0</div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_sv_' + offset + '_0_0"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_ '+ offset + '_1_0">0</div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_sv_' + offset + '_1_0"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="sv_' + offset + '_0"></div></td>'
  + '  <td class="free"></td>'
  + '  <td class="data"><div class="block-cap" id="spieler_' + (offset + 1) + '_0"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_' + (offset + 1) + '_0_0">0</div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_sv_' + (offset + 1) + '_0_0"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_ '+ (offset + 1) + '_1_0">0</div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_sv_' + (offset + 1) + '_1_0"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="sv_' + (offset + 1) + '_0"></div></td>'
  + ' </tr>'
  + ' <tr>'
  + '  <td class="data"><div class="block-cap" id="spieler_' + offset + '_1"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_' + offset + '_0_1">0</div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_sv_' + offset + '_0_1"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_ '+ offset + '_1_1">0</div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_sv_' + offset + '_1_1"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="sv_' + offset + '_1"></div></td>'
  + '  <td class="free"></td>'
  + '  <td class="data"><div class="block-cap" id="spieler_' + (offset + 1) + '_1"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_' + (offset + 1) + '_0_1">0</div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_sv_' + (offset + 1) + '_0_1"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_ '+ (offset + 1) + '_1_1">0</div></td>'
  + '  <td class="data-num"><div class="block-num" id="satz_sv_' + (offset + 1) + '_1_1"></div></td>'
  + '  <td class="data-num"><div class="block-num" id="sv_' + (offset + 1) + '_1"></div></td>'
  + '</tr>'
  + '</table>'
    }
    current_pos = document.getElementById("table")
    current_pos.innerHTML =
        '<h1 id="title">U19 Ländervergleich</h1>'
        + GenerateSprintResultTable(0) + '<p>'
        + GenerateSprintResultTable(2) + '<p>'
        + GenerateSprintResultTable(4) + '<p>'
        + GenerateSprintResultTable(6) + '<p>'
        + GenerateSprintResultTable(8) + '<p>'
        + GenerateSprintResultTable(10) + '<p>'
        + GenerateSprintResultTable(12) + '<p>'
        + GenerateSprintResultTable(14)
</script>
</div>
